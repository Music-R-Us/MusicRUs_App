server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Blazor handles routing in the browser, so unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always fetch the newest index.html, so a new build is picked up straight away
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
